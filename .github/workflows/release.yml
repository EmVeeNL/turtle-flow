name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env:
          PUBLIC_API_ADAPTER: real
      - run: cargo build --locked --release -p turtle-flow --features embedded-dashboard --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir package
          cp "target/${TARGET}/release/turtle" package/turtle
          tar -C package -czf "turtle-${TARGET}.tar.gz" turtle
          shasum -a 256 "turtle-${TARGET}.tar.gz" > "turtle-${TARGET}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: turtle-${{ matrix.target }}
          path: turtle-*.tar.gz*

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*
          generate_release_notes: true

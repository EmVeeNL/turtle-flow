name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @turtle-flow/dashboard...
      - run: pnpm --filter @turtle-flow/dashboard run build
        env:
          PUBLIC_API_ADAPTER: real
      - run: cargo build --locked --release -p turtle-flow --features embedded-dashboard --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir package
          cp "target/${TARGET}/release/turtle" package/turtle
          tar -C package -czf "turtle-${TARGET}.tar.gz" turtle
          shasum -a 256 "turtle-${TARGET}.tar.gz" > "turtle-${TARGET}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turtle-${{ matrix.target }}
          path: turtle-*.tar.gz*

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*
          generate_release_notes: true

name: Web

on:
  push:
    branches: [main]
    paths: ['apps/dashboard/**', 'apps/portal/**', 'apps/website/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/dashboard/**', 'apps/portal/**', 'apps/website/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check lint test build --filter='!@turtle-flow/cli'
      - run: pnpm --filter @turtle-flow/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @turtle-flow/dashboard run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-screenshots
          path: apps/dashboard/screenshots/

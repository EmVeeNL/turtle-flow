[package]
name = "turtle-flow"
description = "Turtle Flow: supervised AI software delivery, orchestrated locally. Provides the `turtle` CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "turtle"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
turtle-agents = { workspace = true }
turtle-artifacts = { workspace = true }
turtle-domain = { workspace = true }
turtle-git = { workspace = true }
turtle-policy = { workspace = true }
turtle-scheduler = { workspace = true }
turtle-store = { workspace = true }
turtle-workflow = { workspace = true }
turtle-tokens = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

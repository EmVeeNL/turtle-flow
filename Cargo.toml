[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
repository = "https://github.com/EmVeeNL/turtle-flow"
publish = false

[workspace.dependencies]
# Internal crates (dependency direction: domain at the bottom, interfaces on top — see docs/ARCHITECTURE.md §4.1)
turtle-domain = { path = "crates/turtle-domain" }
turtle-policy = { path = "crates/turtle-policy" }
turtle-workflow = { path = "crates/turtle-workflow" }
turtle-tokens = { path = "crates/turtle-tokens" }
turtle-exec = { path = "crates/turtle-exec" }
turtle-git = { path = "crates/turtle-git" }
turtle-agents = { path = "crates/turtle-agents" }
turtle-artifacts = { path = "crates/turtle-artifacts" }
turtle-store = { path = "crates/turtle-store" }
turtle-context = { path = "crates/turtle-context" }
turtle-scheduler = { path = "crates/turtle-scheduler" }
turtle-api = { path = "crates/turtle-api" }

# External
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
ulid = { version = "3.0.0", features = ["serde"] }

# Dev
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
